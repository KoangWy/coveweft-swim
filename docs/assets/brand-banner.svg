    </g>
    <text x="174" y="111" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="49" font-weight="700" letter-spacing="5">COVEWEFT</text>
    <text x="177" y="140" fill="#c8f03c" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="8">SWIM</text>
    <text x="78" y="225" fill="#fff" font-family="Georgia, 'Times New Roman', serif" font-size="43" font-style="italic">Find your water.</text>
    <text x="80" y="263" fill="#a9c2d3" font-family="Arial, Helvetica, sans-serif" font-size="15" letter-spacing="2">SWIMWEAR FOR EVERY KIND OF WATER</text>
