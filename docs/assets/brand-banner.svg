<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">COVEWEFT Swim</title>
  <desc id="desc">Find your water. The white cove and lime wave brand mark on a deep navy background.</desc>
  <defs>
    <clipPath id="frame"><rect width="1200" height="320" rx="24"/></clipPath>
    <linearGradient id="sea" x1="700" y1="0" x2="1200" y2="320" gradientUnits="userSpaceOnUse">
      <stop stop-color="#123b5c"/>
      <stop offset="1" stop-color="#0b2545"/>
    </linearGradient>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1200" height="320" fill="#0b2545"/>
    <circle cx="1070" cy="150" r="260" fill="url(#sea)"/>
    <g stroke="#31536e" stroke-width="1.5" opacity=".55">
      <circle cx="1070" cy="150" r="220"/>
      <circle cx="1070" cy="150" r="174"/>
      <circle cx="1070" cy="150" r="128"/>
      <circle cx="1070" cy="150" r="82"/>
    </g>
